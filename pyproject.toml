[project]
name = "b2b-customer-360-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.15.0",
    "faker>=40.36.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyspark>=3.5.0,<3.6.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "simple-salesforce>=1.12.10",
    "streamlit>=1.59.1",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
